name: List Pages Projects

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List Cloudflare Workers and their routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Workers (scripts) in this account ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:', d.get('success')); [print(' -', s.get('id'), '| created:', s.get('created_on'), '| has_assets:', bool(s.get('assets'))) for s in (d.get('result') or [])]"
          echo "=== Routes/Custom domains for each worker ==="
          for wid in $(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; print(' '.join(s.get('id','') for s in (json.load(sys.stdin).get('result') or [])))"); do
            echo "--- worker: $wid ---"
            curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$wid/routes" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); [print('   route:', r.get('pattern')) for r in (d.get('result') or [])]"
            curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$wid" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); s=(d.get('result') or {}); print('   custom_domains:', s.get('custom_domains')); print('   tail_consumers:', s.get('tail_consumers'))"
          done
